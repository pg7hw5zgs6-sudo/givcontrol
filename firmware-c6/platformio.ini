; GivControl for a bare ESP32-C6 dev board (no screen): web page only, RGB status LED on GPIO8.
; Build with ../tools/pio-c6.sh (own PlatformIO folder).
; The C6 needs Arduino core 3.x, so this uses a pinned pioarduino release.

[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions_givcontrol.csv   ; 2 x 1.5 MB app, 960 KB data (2 years of history)
lib_deps =
  tzapu/WiFiManager@2.0.17
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DHAS_DISPLAY=0
  -DRGB_LED_PIN=8
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  '-DMDNS_NAME="givcontrol-c6"'

; Development: install over the network with espota (ArduinoOTA), using the update PIN set on the
; web page:  GIVCONTROL_PIN=yourpin tools/pio-c6.sh -e esp32c6-ota -t upload
[env:esp32c6-ota]
extends = env:esp32c6
upload_protocol = espota
upload_port = givcontrol-c6.local
upload_flags = --auth=${sysenv.GIVCONTROL_PIN}

; Rollback test: a firmware that never confirms itself. Install it from the web page; after 2 minutes
; the previous firmware comes back and Events says so.  tools/pio-c6.sh -e esp32c6-rollbacktest
[env:esp32c6-rollbacktest]
extends = env:esp32c6
build_flags =
  ${env:esp32c6.build_flags}
  -DOTA_TEST_NO_CONFIRM
  '-DGC_VERSION="rollback-test"'
